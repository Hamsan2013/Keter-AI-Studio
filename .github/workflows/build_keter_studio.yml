name: Build Keter AI Studio (Windows & macOS)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: "desktop"
          cache: true

      - name: Configure and Build Windows Executable
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Bundle Official llama.cpp Runtime and Package with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/runtime | Out-Null
          Copy-Item build/Release/KeterAIStudio.exe dist/
          windeployqt --release --no-translations dist/KeterAIStudio.exe

          Write-Host "Fetching official llama.cpp Windows x64 runtime..."
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match "bin-win-cpu-x64\.zip$" -or $_.name -match "bin-win-avx2-x64\.zip$" } | Select-Object -First 1
          if ($asset) {
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llama_win.zip
            Expand-Archive -Path llama_win.zip -DestinationPath dist/runtime -Force
          }

      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: KeterAIStudio-Windows-x64
          path: dist/*

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: "desktop"
          cache: true

      - name: Provide Stub for Deprecated AGL Framework
        run: |
          sudo mkdir -p /Library/Frameworks/AGL.framework
          sudo clang -shared -o /Library/Frameworks/AGL.framework/AGL -x c /dev/null

      - name: Configure and Build macOS App Bundle
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Package and Smoke-Test macOS DMG
        run: |
          macdeployqt build/KeterAIStudio.app -dmg
          mkdir -p dist_mac
          mv build/KeterAIStudio.dmg dist_mac/
          file build/KeterAIStudio.app/Contents/MacOS/KeterAIStudio
          otool -L build/KeterAIStudio.app/Contents/MacOS/KeterAIStudio

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: KeterAIStudio-macOS-arm64
          path: dist_mac/KeterAIStudio.dmg
